name: 'Build Docker'
description: 'Build one Docker image and upload as artifact (BuildKit GHA layer cache)'
inputs:
  context-path:
    description: 'Docker build context path'
    required: false
    default: '.'
  dockerfile:
    description: 'Dockerfile path'
    required: false
    default: 'Dockerfile'
  artifacts:
    description: 'Comma-separated workflow artifact names to download into context-path before build (e.g. budget,worker)'
    required: false
    default: ''
  artifact-name:
    description: 'Image artifact name (default: dockerfile directory, or image when dockerfile is at repo root)'
    required: false
    default: ''
outputs:
  artifact-name:
    description: 'Resolved image artifact name for push-container'
    value: ${{ steps.build.outputs.artifact-name }}
runs:
  using: 'composite'
  steps:
    - name: Checkout Docker context
      uses: actions/checkout@v7

    - name: Download input artifacts
      if: ${{ inputs.artifacts != '' }}
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ contains(inputs.artifacts, ',') && format('{{{0}}}', inputs.artifacts) || inputs.artifacts }}
        path: ${{ inputs.context-path }}
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and save image
      id: build
      shell: bash
      env:
        ARTIFACT_NAME_INPUT: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail

        ARTIFACT_NAME="$ARTIFACT_NAME_INPUT"
        if [ -z "$ARTIFACT_NAME" ]; then
          dir=$(dirname "${{ inputs.dockerfile }}")
          if [ "$dir" = "." ]; then
            ARTIFACT_NAME="image"
          else
            ARTIFACT_NAME="$dir"
          fi
        fi
        echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

        docker buildx build \
          --file "${{ inputs.dockerfile }}" \
          --tag "build-docker-local:${ARTIFACT_NAME}" \
          --cache-from "type=gha,scope=${ARTIFACT_NAME}" \
          --cache-to "type=gha,scope=${ARTIFACT_NAME},mode=max" \
          --load \
          "${{ inputs.context-path }}"

        docker save "build-docker-local:${ARTIFACT_NAME}" \
          -o "${{ runner.temp }}/build-docker-${ARTIFACT_NAME}.tar"
        cp "${{ runner.temp }}/build-docker-${ARTIFACT_NAME}.tar" "${ARTIFACT_NAME}.tar"

    - name: Upload image artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build.outputs.artifact-name }}
        path: ${{ format('{0}.tar', steps.build.outputs.artifact-name) }}
        if-no-files-found: error
