name: 'Build Docker'
description: 'Build one Docker image and upload as artifact (BuildKit GHA layer cache)'
inputs:
  context-path:
    description: 'Docker build context path'
    required: false
    default: '.'
  dockerfile:
    description: 'Dockerfile path'
    required: false
    default: 'Dockerfile'
  artifacts:
    description: 'Multiline workflow artifact names to download into context-path before build'
    required: false
    default: ''
  artifact-name:
    description: 'Optional image artifact name override (default derived from dockerfile)'
    required: false
    default: ''
outputs:
  artifact-name:
    description: 'Resolved image artifact name for push-container'
    value: ${{ steps.build.outputs.artifact-name }}
runs:
  using: 'composite'
  steps:
    - name: Checkout Docker context
      uses: actions/checkout@v7

    - name: Resolve artifact pattern
      id: artifact-pattern
      if: ${{ inputs.artifacts != '' }}
      shell: bash
      env:
        ARTIFACTS: ${{ inputs.artifacts }}
      run: |
        set -euo pipefail
        pattern=$(printf '%s' "$ARTIFACTS" | jq -Rsc '
          split("\n")
          | map(gsub("\r"; ""))
          | map(select(length > 0))
          | if length == 0 then ""
            elif length == 1 then .[0]
            else "{\(. | join(","))}"
            end
        ' -r)
        if [ -z "$pattern" ]; then
          echo "No artifact names provided" >&2
          exit 1
        fi
        echo "pattern=${pattern}" >> "$GITHUB_OUTPUT"

    - name: Download input artifacts
      if: ${{ inputs.artifacts != '' }}
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ steps.artifact-pattern.outputs.pattern }}
        path: ${{ inputs.context-path }}
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and save image
      id: build
      shell: bash
      env:
        ARTIFACT_NAME_INPUT: ${{ inputs.artifact-name }}
      run: |
        set -euo pipefail

        ARTIFACT_NAME="$ARTIFACT_NAME_INPUT"
        if [ -z "$ARTIFACT_NAME" ]; then
          ARTIFACT_NAME=$(basename "${{ inputs.dockerfile }}")
          if [ "$ARTIFACT_NAME" = "Dockerfile" ]; then
            ARTIFACT_NAME="image"
          fi
        fi
        echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

        docker buildx build \
          --file "${{ inputs.dockerfile }}" \
          --tag "build-docker-local:${ARTIFACT_NAME}" \
          --cache-from "type=gha,scope=${ARTIFACT_NAME}" \
          --cache-to "type=gha,scope=${ARTIFACT_NAME},mode=max" \
          --load \
          "${{ inputs.context-path }}"

        docker save "build-docker-local:${ARTIFACT_NAME}" \
          -o "${{ runner.temp }}/build-docker-${ARTIFACT_NAME}.tar"
        cp "${{ runner.temp }}/build-docker-${ARTIFACT_NAME}.tar" "${ARTIFACT_NAME}.tar"

    - name: Upload image artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build.outputs.artifact-name }}
        path: ${{ format('{0}.tar', steps.build.outputs.artifact-name) }}
        if-no-files-found: error
