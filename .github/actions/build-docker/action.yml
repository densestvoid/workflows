name: 'Build Docker'
description: 'Build one Docker image and upload as artifact (BuildKit GHA layer cache)'
inputs:
  context-path:
    description: 'Docker build context path'
    required: false
    default: '.'
  dockerfile:
    description: 'Dockerfile path'
    required: false
    default: 'Dockerfile'
  artifacts:
    description: 'Comma-separated workflow artifact names to download into context-path before build (e.g. budget,worker)'
    required: false
    default: ''
  artifact-name:
    description: 'Image artifact name (default: directory containing dockerfile)'
    required: false
    default: ''
outputs:
  artifact-name:
    description: 'Resolved image artifact name for push-container'
    value: ${{ steps.build.outputs.artifact-name }}
runs:
  using: 'composite'
  steps:
    - name: Checkout Docker context
      uses: actions/checkout@v7

    - name: Download input artifacts
      if: ${{ inputs.artifacts != '' }}
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ contains(inputs.artifacts, ',') && format('{{{0}}}', inputs.artifacts) || inputs.artifacts }}
        path: ${{ inputs.context-path }}
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and save image
      id: build
      shell: bash
      run: |
        set -euo pipefail
        name='${{ inputs.artifact-name }}'
        [ -z "$name" ] && name=$(dirname '${{ inputs.dockerfile }}')
        printf 'artifact-name=%s\n' "$name" >> "$GITHUB_OUTPUT"

        docker buildx build \
          --file "${{ inputs.dockerfile }}" \
          --tag "build-docker-local:${name}" \
          --cache-from "type=gha,scope=${name}" \
          --cache-to "type=gha,scope=${name},mode=max" \
          --load \
          "${{ inputs.context-path }}"

        docker save "build-docker-local:${name}" \
          -o "${{ runner.temp }}/build-docker-${name}.tar"
        cp "${{ runner.temp }}/build-docker-${name}.tar" "${name}.tar"

    - name: Upload image artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build.outputs.artifact-name }}
        path: ${{ format('{0}.tar', steps.build.outputs.artifact-name) }}
        if-no-files-found: error
