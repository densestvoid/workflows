name: 'Build Docker'
description: 'Build one Docker image and upload as artifact (BuildKit GHA layer cache)'
inputs:
  context-path:
    description: 'Docker build context path'
    required: false
    default: '.'
  dockerfile:
    description: 'Dockerfile path'
    required: false
    default: 'Dockerfile'
  artifacts:
    description: 'Comma-separated workflow artifact names to download into context-path before build (e.g. budget,worker)'
    required: false
    default: ''
  artifact-name:
    description: 'Image artifact name (default: directory containing dockerfile)'
    required: false
    default: ''
outputs:
  artifact-name:
    description: 'Resolved image artifact name for push-container'
    value: ${{ env.ARTIFACT_NAME }}
runs:
  using: 'composite'
  steps:
    - name: Checkout Docker context
      uses: actions/checkout@v7

    - name: Download input artifacts
      if: ${{ inputs.artifacts != '' }}
      uses: actions/download-artifact@v8
      with:
        pattern: ${{ contains(inputs.artifacts, ',') && format('{{{0}}}', inputs.artifacts) || inputs.artifacts }}
        path: ${{ inputs.context-path }}
        merge-multiple: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Resolve artifact name
      shell: bash
      run: |
        set -euo pipefail
        ARTIFACT_NAME='${{ inputs.artifact-name }}'
        ARTIFACT_NAME="${ARTIFACT_NAME:-$(basename "$(dirname '${{ inputs.dockerfile }}')")}"
        echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

    - name: Build and save image
      shell: bash
      run: |
        set -euo pipefail
        docker buildx build \
          --file "${{ inputs.dockerfile }}" \
          --tag "build-docker-local:${{ env.ARTIFACT_NAME }}" \
          --cache-from "type=gha,scope=${{ env.ARTIFACT_NAME }}" \
          --cache-to "type=gha,scope=${{ env.ARTIFACT_NAME }},mode=max" \
          --load \
          "${{ inputs.context-path }}"

        docker save "build-docker-local:${{ env.ARTIFACT_NAME }}" \
          -o "${{ runner.temp }}/build-docker-${{ env.ARTIFACT_NAME }}.tar"
        cp "${{ runner.temp }}/build-docker-${{ env.ARTIFACT_NAME }}.tar" "${{ env.ARTIFACT_NAME }}.tar"

    - name: Upload image artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ format('{0}.tar', env.ARTIFACT_NAME) }}
        if-no-files-found: error
