name: 'Build Docker'
description: 'Build one Docker image and upload as artifact (BuildKit GHA layer cache)'
inputs:
  context-path:
    description: 'Docker build context path'
    required: false
    default: '.'
  dockerfile:
    description: 'Dockerfile path'
    required: false
    default: 'Dockerfile'
  artifacts:
    description: 'Multiline list of workflow artifact names to download into context-path before build'
    required: false
    default: ''
  artifact-name:
    description: 'Output artifact name (default: basename of dockerfile, or image when dockerfile is Dockerfile)'
    required: false
    default: ''
outputs:
  artifact-name:
    description: 'Uploaded image artifact name'
    value: ${{ steps.build.outputs.artifact-name }}
runs:
  using: 'composite'
  steps:
    - name: Checkout Docker context
      uses: actions/checkout@v7

    - name: Download input artifacts
      if: ${{ inputs.artifacts != '' }}
      shell: bash
      run: |
        set -euo pipefail
        while IFS= read -r name; do
          [ -z "$name" ] && continue
          gh run download "$GITHUB_RUN_ID" --name "$name" --dir "${{ inputs.context-path }}"
        done <<< '${{ inputs.artifacts }}'

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and save image
      id: build
      shell: bash
      run: |
        set -euo pipefail

        DOCKERFILE="${{ inputs.dockerfile }}"
        ARTIFACT_NAME="${{ inputs.artifact-name }}"
        if [ -z "$ARTIFACT_NAME" ]; then
          ARTIFACT_NAME=$(basename "$DOCKERFILE")
          if [ "$ARTIFACT_NAME" = "Dockerfile" ]; then
            ARTIFACT_NAME="image"
          fi
        fi
        echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

        LOCAL_TAG="build-docker-local:${ARTIFACT_NAME}"
        IMAGE_TAR="${{ runner.temp }}/build-docker-${ARTIFACT_NAME}.tar"

        docker buildx build \
          --file "$DOCKERFILE" \
          --tag "$LOCAL_TAG" \
          --cache-from "type=gha,scope=${ARTIFACT_NAME}" \
          --cache-to "type=gha,scope=${ARTIFACT_NAME},mode=max" \
          --load \
          "${{ inputs.context-path }}"

        docker save "$LOCAL_TAG" -o "$IMAGE_TAR"
        cp "$IMAGE_TAR" "${ARTIFACT_NAME}.tar"

    - name: Upload image artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.build.outputs.artifact-name }}
        path: ${{ format('{0}.tar', steps.build.outputs.artifact-name) }}
        if-no-files-found: error
