name: 'Build Docker'
description: 'Build one Docker image and upload as artifact (cached internally)'
inputs:
  context:
    description: 'Docker build context'
    required: false
    default: '.'
  dockerfile:
    description: 'Dockerfile path'
    required: false
    default: 'Dockerfile'
  hash-paths:
    description: 'Multiline glob patterns for cache key (same style as detect-changes paths)'
    required: true
  artifacts:
    description: 'Multiline list of artifact names to download from build-go'
    required: false
    default: ''
  artifact-name:
    description: 'Output artifact name (default: basename of dockerfile)'
    required: false
    default: ''
outputs:
  artifact-name:
    description: 'Uploaded image artifact name'
    value: ${{ steps.meta.outputs.artifact-name }}
runs:
  using: 'composite'
  steps:
    - name: Resolve inputs
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        DOCKERFILE="${{ inputs.dockerfile }}"
        ARTIFACT_NAME="${{ inputs.artifact-name }}"
        if [ -z "$ARTIFACT_NAME" ]; then
          ARTIFACT_NAME=$(basename "$DOCKERFILE")
          if [ "$ARTIFACT_NAME" = "Dockerfile" ]; then
            ARTIFACT_NAME="image"
          fi
        fi
        echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
        echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"

    - name: Checkout Docker context
      uses: actions/checkout@v7

    - name: Download input artifacts
      if: ${{ inputs.artifacts != '' }}
      shell: bash
      env:
        ARTIFACTS: ${{ inputs.artifacts }}
        CONTEXT: ${{ inputs.context }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        while IFS= read -r name; do
          [ -z "$name" ] && continue
          gh run download "$GITHUB_RUN_ID" --name "$name" --dir "$CONTEXT"
        done <<< "$ARTIFACTS"

    - name: Compute cache key
      id: cache-key
      shell: bash
      run: |
        set -euo pipefail
        CONTEXT="${{ inputs.context }}"
        DOCKERFILE="${{ steps.meta.outputs.dockerfile }}"

        mapfile -t PATTERNS < <(printf '%s\n' "${{ inputs.hash-paths }}" | sed '/^[[:space:]]*$/d')
        if [ "${#PATTERNS[@]}" -eq 0 ]; then
          echo "No hash-paths patterns provided" >&2
          exit 1
        fi

        HASH_INPUT=$(mktemp)
        trap 'rm -f "$HASH_INPUT"' EXIT
        : > "$HASH_INPUT"
        printf '%s\0' "$DOCKERFILE" >> "$HASH_INPUT"
        cat "$DOCKERFILE" >> "$HASH_INPUT"
        while IFS= read -r -d '' file; do
          printf '%s\0' "$file" >> "$HASH_INPUT"
          cat "$file" >> "$HASH_INPUT"
        done < <(
          # Resolve caller hash-paths globs against the checked-out tree (pathspec expansion).
          git -C "$GITHUB_WORKSPACE" ls-files -z -- "${PATTERNS[@]}"
        )
        while IFS= read -r name || [ -n "$name" ]; do
          [ -z "$name" ] && continue
          printf '%s\0' "$name" >> "$HASH_INPUT"
          for candidate in "${CONTEXT}/${name}" "${GITHUB_WORKSPACE}/${name}"; do
            if [ -f "$candidate" ]; then
              cat "$candidate" >> "$HASH_INPUT"
            fi
          done
        done <<< '${{ inputs.artifacts }}'
        HASH=$(sha256sum "$HASH_INPUT" | awk '{print substr($1,1,16)}')
        echo "key=${HASH}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Restore image cache
      uses: actions/cache@v4
      id: image-cache
      with:
        path: ${{ runner.temp }}/build-docker-${{ steps.meta.outputs.artifact-name }}.tar
        key: build-docker-${{ steps.cache-key.outputs.key }}-${{ steps.meta.outputs.dockerfile }}-${{ runner.os }}
        restore-keys: |
          build-docker-${{ steps.cache-key.outputs.key }}-

    - name: Build and save image
      shell: bash
      env:
        CONTEXT: ${{ inputs.context }}
        DOCKERFILE: ${{ steps.meta.outputs.dockerfile }}
        ARTIFACT_NAME: ${{ steps.meta.outputs.artifact-name }}
        IMAGE_TAR: ${{ runner.temp }}/build-docker-${{ steps.meta.outputs.artifact-name }}.tar
        LOCAL_TAG: build-docker-local:${{ steps.meta.outputs.artifact-name }}
      run: |
        set -euo pipefail

        if [ ! -f "$IMAGE_TAR" ]; then
          docker buildx build \
            --file "$DOCKERFILE" \
            --tag "$LOCAL_TAG" \
            --load \
            "$CONTEXT"
          docker save "$LOCAL_TAG" -o "$IMAGE_TAR"
        fi

        cp "$IMAGE_TAR" "${ARTIFACT_NAME}.tar"

    - name: Upload image artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.meta.outputs.artifact-name }}
        path: ${{ format('{0}.tar', steps.meta.outputs.artifact-name) }}
        if-no-files-found: error
