name: 'Terraform Output'
description: 'Read a single Terraform output after deploy-terraform in the same job'
inputs:
  terraform-dir:
    description: 'Path to Terraform root module (must already be initialized)'
    required: true
  name:
    description: 'Terraform output name (single-line value, e.g. a URL)'
    required: true
outputs:
  value:
    description: 'Raw output value'
    value: ${{ steps.read.outputs.value }}
runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false

    - name: Read output
      id: read
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}
      run: |
        set -euo pipefail
        value=$(terraform output -raw "${{ inputs.name }}")
        echo "value=$value" >> "$GITHUB_OUTPUT"
