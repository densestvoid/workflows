name: 'Install and Cache Go Tool'
description: 'Install and cache a Go CLI tool'
inputs:
  tool-package:
    description: 'Go package path for the tool'
    required: true
  tool-version:
    description: 'Version of the tool to install (e.g., latest, v1.0.0)'
    required: false
    default: 'latest'
runs:
  using: 'composite'
  steps:
    - name: Resolve tool
      id: tool
      shell: bash
      run: |
        set -euo pipefail
        TOOL_NAME=$(basename "${{ inputs.tool-package }}")
        echo "name=${TOOL_NAME}" >> "$GITHUB_OUTPUT"
        echo "path=${HOME}/go/bin/${TOOL_NAME}" >> "$GITHUB_OUTPUT"

    - name: Cache tool
      uses: actions/cache@v4
      with:
        path: ${{ steps.tool.outputs.path }}
        key: install-go-tool-${{ inputs.tool-package }}-${{ inputs.tool-version }}-${{ runner.os }}
        restore-keys: |
          install-go-tool-${{ inputs.tool-package }}-${{ runner.os }}-

    - name: Go install
      shell: bash
      run: |
        set -euo pipefail
        TOOL_NAME="${{ steps.tool.outputs.name }}"
        TOOL_PATH="${{ steps.tool.outputs.path }}"
        if [ ! -f "$TOOL_PATH" ]; then
          mkdir -p "$(dirname "$TOOL_PATH")"
          GOBIN="$(dirname "$TOOL_PATH")" go install "${{ inputs.tool-package }}@${{ inputs.tool-version }}"
        fi
