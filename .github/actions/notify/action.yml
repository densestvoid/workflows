name: 'Notify'
description: >-
  Post Slack notification and/or PR comment. Slack: plain slack-text, inline
  slack-payload JSON (attachments/blocks), or slack-payload-file (budget-style
  artifact path). PR comment via github-script.
inputs:
  slack-webhook:
    description: 'Slack incoming webhook URL'
    required: false
    default: ''
  slack-text:
    description: 'Plain Slack message text (used when slack-payload and slack-payload-file are unset)'
    required: false
    default: ''
  slack-payload:
    description: >-
      Slack incoming-webhook JSON payload (text, attachments, blocks, etc.).
      Passed to slack-github-action payload input — no file required.
    required: false
    default: ''
  slack-payload-file:
    description: >-
      Path to a Slack incoming-webhook JSON payload file (e.g. slack-payload.json
      from a downloaded artifact). Used when the caller builds rich payloads in a
      prior step.
    required: false
    default: ''
  pr-number:
    description: 'PR/issue number for comment'
    required: false
    default: ''
  pr-body:
    description: 'Markdown body for PR comment'
    required: false
    default: ''
  github-token:
    description: 'Token for PR comment API'
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Comment on PR
      if: always() && inputs.pr-number != '' && inputs.pr-body != ''
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const prNumber = parseInt('${{ inputs.pr-number }}', 10);
          const body = ${{ toJSON(inputs.pr-body) }};
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            body
          });

    - name: Send Slack notification (payload file)
      if: >-
        always() &&
        inputs.slack-webhook != '' &&
        inputs.slack-payload-file != '' &&
        hashFiles(inputs.slack-payload-file) != ''
      uses: slackapi/slack-github-action@v4.0.0
      with:
        webhook-type: incoming-webhook
        webhook: ${{ inputs.slack-webhook }}
        payload-file-path: ${{ inputs.slack-payload-file }}

    - name: Send Slack notification (payload)
      if: >-
        always() &&
        inputs.slack-webhook != '' &&
        inputs.slack-payload != '' &&
        (inputs.slack-payload-file == '' || hashFiles(inputs.slack-payload-file) == '')
      uses: slackapi/slack-github-action@v4.0.0
      with:
        webhook-type: incoming-webhook
        webhook: ${{ inputs.slack-webhook }}
        payload: ${{ inputs.slack-payload }}

    - name: Send Slack notification (text)
      if: >-
        always() &&
        inputs.slack-webhook != '' &&
        inputs.slack-text != '' &&
        inputs.slack-payload == '' &&
        (inputs.slack-payload-file == '' || hashFiles(inputs.slack-payload-file) == '')
      uses: slackapi/slack-github-action@v4.0.0
      with:
        webhook-type: incoming-webhook
        webhook: ${{ inputs.slack-webhook }}
        payload: ${{ format('{"text":{0}}', toJSON(inputs.slack-text)) }}
