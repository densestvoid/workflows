name: 'Terminate Terraform'
description: 'Destroy resources from state using bundled pr-destroy module and delete S3 state'
inputs:
  backend-key:
    description: 'S3 state key to destroy and delete'
    required: true
  do-token:
    description: 'DigitalOcean API token'
    required: true
  terraform-aws-access-key-id:
    description: 'S3 backend access key ID'
    required: true
  terraform-aws-secret-access-key:
    description: 'S3 backend secret access key'
    required: true
  terraform-aws-region:
    description: 'S3 backend region'
    required: true
  variables:
    description: 'Multiline KEY=value Terraform variables if required'
    required: false
    default: ''
outputs:
  destroyed:
    description: 'true on successful destroy'
    value: ${{ steps.terminate.outputs.destroyed }}
  state-deleted:
    description: 'true when S3 state file was removed'
    value: ${{ steps.terminate.outputs.state-deleted }}
runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.5.7
        terraform_wrapper: false

    - name: Terminate
      id: terminate
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.terraform-aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.terraform-aws-secret-access-key }}
        AWS_REGION: ${{ inputs.terraform-aws-region }}
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}/pr-destroy"

        VAR_ARGS=(-var "do_token=${{ inputs.do-token }}")
        while IFS= read -r line || [ -n "$line" ]; do
          [ -z "$line" ] && continue
          key="${line%%=*}"
          val="${line#*=}"
          VAR_ARGS+=(-var "${key}=${val}")
        done <<< '${{ inputs.variables }}'

        BACKEND_KEY="${{ inputs.backend-key }}"
        STATE_BUCKET="densestvoid-terraform"

        echo "destroyed=false" >> "$GITHUB_OUTPUT"
        echo "state-deleted=false" >> "$GITHUB_OUTPUT"

        if ! terraform init \
          -backend-config="key=${BACKEND_KEY}" \
          -backend-config="region=${{ inputs.terraform-aws-region }}"; then
          echo "Terraform init failed" >&2
          exit 1
        fi

        RESOURCE_COUNT=$(terraform state list 2>/dev/null | wc -l | tr -d ' ')

        if [ "$RESOURCE_COUNT" -eq 0 ]; then
          echo "No resources in state — already terminated"
          echo "destroyed=true" >> "$GITHUB_OUTPUT"
          if aws s3 rm "s3://${STATE_BUCKET}/${BACKEND_KEY}"; then
            echo "state-deleted=true" >> "$GITHUB_OUTPUT"
          elif ! aws s3 ls "s3://${STATE_BUCKET}/${BACKEND_KEY}" >/dev/null 2>&1; then
            echo "state-deleted=true" >> "$GITHUB_OUTPUT"
          else
            echo "State empty but S3 state file could not be removed" >&2
            exit 1
          fi
          exit 0
        fi

        if ! terraform apply -auto-approve "${VAR_ARGS[@]}"; then
          echo "Terraform apply failed during state teardown" >&2
          exit 1
        fi

        echo "destroyed=true" >> "$GITHUB_OUTPUT"

        if aws s3 rm "s3://${STATE_BUCKET}/${BACKEND_KEY}"; then
          echo "state-deleted=true" >> "$GITHUB_OUTPUT"
        else
          echo "Destroy succeeded but S3 state file could not be removed" >&2
          exit 1
        fi
