name: 'Terminate Terraform'
description: >-
  Destroy resources from state using bundled pr-destroy module and delete S3 state.
  Pass Terraform variables via TF_VAR_* env on the invoking workflow step
  (e.g. TF_VAR_do_token). AWS S3 backend settings are action inputs.
inputs:
  backend-key:
    description: 'S3 state key to destroy and delete'
    required: true
  terraform-s3-bucket:
    description: 'S3 state bucket (must match the bucket used at deploy init)'
    required: true
  terraform-aws-access-key-id:
    description: 'S3 backend access key ID (passed to terraform init -backend-config)'
    required: true
  terraform-aws-secret-access-key:
    description: 'S3 backend secret access key (passed to terraform init -backend-config)'
    required: true
  terraform-aws-region:
    description: 'S3 backend region (passed to terraform init -backend-config and aws cli)'
    required: true
outputs:
  destroyed:
    description: 'true on successful destroy'
    value: ${{ steps.terminate.outputs.destroyed }}
  state-deleted:
    description: 'true when S3 state file was removed'
    value: ${{ steps.terminate.outputs.state-deleted }}
runs:
  using: 'composite'
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false

    - name: Terminate
      id: terminate
      shell: bash
      working-directory: ${{ github.action_path }}/pr-destroy
      run: |
        set -euo pipefail

        aws_cli() {
          AWS_ACCESS_KEY_ID='${{ inputs.terraform-aws-access-key-id }}' \
          AWS_SECRET_ACCESS_KEY='${{ inputs.terraform-aws-secret-access-key }}' \
          AWS_DEFAULT_REGION='${{ inputs.terraform-aws-region }}' \
          aws "$@"
        }

        echo "destroyed=false" >> "$GITHUB_OUTPUT"
        echo "state-deleted=false" >> "$GITHUB_OUTPUT"

        if ! terraform init \
          -backend-config="bucket=${{ inputs.terraform-s3-bucket }}" \
          -backend-config="key=${{ inputs.backend-key }}" \
          -backend-config="region=${{ inputs.terraform-aws-region }}" \
          -backend-config="access_key=${{ inputs.terraform-aws-access-key-id }}" \
          -backend-config="secret_key=${{ inputs.terraform-aws-secret-access-key }}"; then
          echo "Terraform init failed" >&2
          exit 1
        fi

        resource_count=$(terraform state list 2>/dev/null | wc -l | tr -d ' ')

        if [ "$resource_count" -eq 0 ]; then
          echo "No resources in state — already terminated"
          echo "destroyed=true" >> "$GITHUB_OUTPUT"
          if aws_cli s3 rm "s3://${{ inputs.terraform-s3-bucket }}/${{ inputs.backend-key }}"; then
            echo "state-deleted=true" >> "$GITHUB_OUTPUT"
          elif ! aws_cli s3 ls "s3://${{ inputs.terraform-s3-bucket }}/${{ inputs.backend-key }}" >/dev/null 2>&1; then
            echo "state-deleted=true" >> "$GITHUB_OUTPUT"
          else
            echo "State empty but S3 state file could not be removed" >&2
            exit 1
          fi
          exit 0
        fi

        if ! terraform apply -auto-approve; then
          echo "Terraform apply failed during state teardown" >&2
          exit 1
        fi

        echo "destroyed=true" >> "$GITHUB_OUTPUT"

        if aws_cli s3 rm "s3://${{ inputs.terraform-s3-bucket }}/${{ inputs.backend-key }}"; then
          echo "state-deleted=true" >> "$GITHUB_OUTPUT"
        else
          echo "Destroy succeeded but S3 state file could not be removed" >&2
          exit 1
        fi
