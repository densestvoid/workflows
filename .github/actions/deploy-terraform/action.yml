name: 'Deploy Terraform'
description: 'Terraform init and apply with variables passed as a JSON var-file'
inputs:
  terraform-dir:
    description: 'Path to Terraform root module in the caller repo'
    required: true
  backend-key:
    description: 'S3 state key'
    required: true
  do-token:
    description: 'DigitalOcean API token'
    required: false
    default: ''
  terraform-aws-access-key-id:
    description: 'S3 backend access key ID'
    required: true
  terraform-aws-secret-access-key:
    description: 'S3 backend secret access key'
    required: true
  terraform-aws-region:
    description: 'S3 backend region'
    required: true
  variables-json:
    description: 'JSON object of Terraform variables (e.g. {"deployment_id":"pr-42"})'
    required: false
    default: '{}'
runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false

    - name: Init and apply
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.terraform-aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.terraform-aws-secret-access-key }}
        AWS_REGION: ${{ inputs.terraform-aws-region }}
        DO_TOKEN: ${{ inputs.do-token }}
        VARIABLES_JSON: ${{ inputs.variables-json }}
      run: |
        set -euo pipefail
        cd "${{ inputs.terraform-dir }}"

        TFVARS="${RUNNER_TEMP}/ci.auto.tfvars.json"
        if [ -z "$VARIABLES_JSON" ] || [ "$VARIABLES_JSON" = "{}" ]; then
          echo '{}' > "$TFVARS"
        else
          printf '%s' "$VARIABLES_JSON" > "$TFVARS"
        fi
        jq empty "$TFVARS"

        if [ -n "$DO_TOKEN" ]; then
          jq --arg token "$DO_TOKEN" '. + {do_token: $token}' "$TFVARS" > "${TFVARS}.tmp"
          mv "${TFVARS}.tmp" "$TFVARS"
        fi

        terraform init \
          -backend-config="key=${{ inputs.backend-key }}" \
          -backend-config="region=${{ inputs.terraform-aws-region }}"

        terraform apply -auto-approve -var-file="$TFVARS"
