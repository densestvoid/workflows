name: 'Deploy Terraform'
description: 'Terraform init and apply with variables passed as -var flags'
inputs:
  terraform-dir:
    description: 'Path to Terraform root module in the caller repo'
    required: true
  backend-key:
    description: 'S3 state key'
    required: true
  do-token:
    description: 'DigitalOcean API token'
    required: false
    default: ''
  terraform-aws-access-key-id:
    description: 'S3 backend access key ID'
    required: true
  terraform-aws-secret-access-key:
    description: 'S3 backend secret access key'
    required: true
  terraform-aws-region:
    description: 'S3 backend region'
    required: true
  variables:
    description: 'Multiline KEY=value Terraform variables'
    required: false
    default: ''
outputs:
  outputs:
    description: 'JSON object of all Terraform outputs'
    value: ${{ steps.apply.outputs.outputs }}
runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.5.7
        terraform_wrapper: false

    - name: Init and apply
      id: apply
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.terraform-aws-access-key-id }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.terraform-aws-secret-access-key }}
        AWS_REGION: ${{ inputs.terraform-aws-region }}
      run: |
        set -euo pipefail
        cd "${{ inputs.terraform-dir }}"

        VAR_ARGS=()
        if [ -n "${{ inputs.do-token }}" ]; then
          VAR_ARGS+=(-var "do_token=${{ inputs.do-token }}")
        fi
        while IFS= read -r line || [ -n "$line" ]; do
          [ -z "$line" ] && continue
          key="${line%%=*}"
          val="${line#*=}"
          VAR_ARGS+=(-var "${key}=${val}")
        done <<< '${{ inputs.variables }}'

        terraform init \
          -backend-config="key=${{ inputs.backend-key }}" \
          -backend-config="region=${{ inputs.terraform-aws-region }}"

        terraform apply -auto-approve "${VAR_ARGS[@]}"

        OUTPUTS=$(terraform output -json)
        {
          echo "outputs<<EOF"
          echo "$OUTPUTS"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
