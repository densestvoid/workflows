name: 'Deploy Terraform'
description: 'Terraform init and apply with variables-json as a temp var-file and do-token as -var'
inputs:
  terraform-dir:
    description: 'Path to Terraform root module in the caller repo'
    required: true
  backend-key:
    description: 'S3 state key'
    required: true
  do-token:
    description: 'DigitalOcean API token (passed to terraform apply as -var=do_token=...)'
    required: false
    default: ''
  terraform-aws-access-key-id:
    description: 'S3 backend access key ID (passed to terraform init -backend-config)'
    required: true
  terraform-aws-secret-access-key:
    description: 'S3 backend secret access key (passed to terraform init -backend-config)'
    required: true
  terraform-aws-region:
    description: 'S3 backend region (passed to terraform init -backend-config)'
    required: true
  variables-json:
    description: 'JSON object of Terraform variables (default {}). Written to ${RUNNER_TEMP}/ci.auto.tfvars.json'
    required: false
    default: '{}'
runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_wrapper: false

    - name: Prepare Terraform variables
      shell: bash
      run: |
        set -euo pipefail
        printf '%s' '${{ inputs.variables-json }}' > "${RUNNER_TEMP}/ci.auto.tfvars.json"
        jq empty "${RUNNER_TEMP}/ci.auto.tfvars.json"

    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}
      run: |
        set -euo pipefail
        terraform init \
          -backend-config="key=${{ inputs.backend-key }}" \
          -backend-config="region=${{ inputs.terraform-aws-region }}" \
          -backend-config="access_key=${{ inputs.terraform-aws-access-key-id }}" \
          -backend-config="secret_key=${{ inputs.terraform-aws-secret-access-key }}"

    - name: Terraform apply
      shell: bash
      working-directory: ${{ inputs.terraform-dir }}
      run: |
        set -euo pipefail
        terraform apply -auto-approve \
          -var-file="${RUNNER_TEMP}/ci.auto.tfvars.json" \
          ${{ inputs.do-token != '' && format('-var=do_token={0}', inputs.do-token) || '' }}
