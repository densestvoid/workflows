name: 'Push Container'
description: 'Load image artifact and push to all configured registries'
inputs:
  image-artifact:
    description: 'Artifact name from build-docker'
    required: true
  tag:
    description: 'Remote registry tag'
    required: true
  ghcr-image:
    description: 'GHCR image (e.g. owner/repo/app)'
    required: false
    default: ''
  ghcr-username:
    description: 'GHCR username'
    required: false
    default: ''
  ghcr-password:
    description: 'GHCR password or token'
    required: false
    default: ''
  dockerhub-image:
    description: 'Docker Hub image (e.g. user/app)'
    required: false
    default: ''
  dockerhub-username:
    description: 'Docker Hub username'
    required: false
    default: ''
  dockerhub-password:
    description: 'Docker Hub password or token'
    required: false
    default: ''
outputs:
  image-ref:
    description: 'Primary registry image reference'
    value: ${{ steps.push.outputs.image-ref }}
  ghcr-image-ref:
    description: 'GHCR image reference'
    value: ${{ steps.push.outputs.ghcr-image-ref }}
  ghcr-pushed:
    description: 'true when pushed to GHCR'
    value: ${{ steps.push.outputs.ghcr-pushed }}
  dockerhub-image-ref:
    description: 'Docker Hub image reference'
    value: ${{ steps.push.outputs.dockerhub-image-ref }}
  dockerhub-pushed:
    description: 'true when pushed to Docker Hub'
    value: ${{ steps.push.outputs.dockerhub-pushed }}
runs:
  using: 'composite'
  steps:
    - name: Download image artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.image-artifact }}
        path: ${{ runner.temp }}/push-container

    - name: Resolve registries
      id: registries
      shell: bash
      run: |
        set -euo pipefail
        configured=0

        if [ -n "${{ inputs.ghcr-image }}" ] && [ -n "${{ inputs.ghcr-username }}" ] && [ -n "${{ inputs.ghcr-password }}" ]; then
          echo "ghcr=true" >> "$GITHUB_OUTPUT"
          if [[ "${{ inputs.ghcr-image }}" == ghcr.io/* ]]; then
            echo "ghcr-ref=${{ inputs.ghcr-image }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ghcr-ref=ghcr.io/${{ inputs.ghcr-image }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi
          configured=$((configured + 1))
        else
          echo "ghcr=false" >> "$GITHUB_OUTPUT"
        fi

        if [ -n "${{ inputs.dockerhub-image }}" ] && [ -n "${{ inputs.dockerhub-username }}" ] && [ -n "${{ inputs.dockerhub-password }}" ]; then
          echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          echo "dockerhub-ref=${{ inputs.dockerhub-image }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          configured=$((configured + 1))
        else
          echo "dockerhub=false" >> "$GITHUB_OUTPUT"
        fi

        if [ "$configured" -eq 0 ]; then
          echo "No registries configured" >&2
          exit 1
        fi

    - name: Login to GHCR
      if: steps.registries.outputs.ghcr == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.ghcr-username }}
        password: ${{ inputs.ghcr-password }}

    - name: Login to Docker Hub
      if: steps.registries.outputs.dockerhub == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}

    - name: Load and push
      id: push
      shell: bash
      run: |
        set -euo pipefail

        ARTIFACT_DIR="${{ runner.temp }}/push-container"
        TAR_FILE=$(find "$ARTIFACT_DIR" -name '*.tar' -type f | head -1)
        if [ -z "$TAR_FILE" ]; then
          TAR_FILE="${ARTIFACT_DIR}/${{ inputs.image-artifact }}.tar"
        fi
        if [ ! -f "$TAR_FILE" ]; then
          echo "Image tar not found in ${ARTIFACT_DIR}" >&2
          exit 1
        fi

        LOAD_OUTPUT=$(docker load -i "$TAR_FILE")
        echo "$LOAD_OUTPUT"
        LOCAL_IMAGE=$(echo "$LOAD_OUTPUT" | sed -n 's/^Loaded image: //p' | head -1)
        if [ -z "$LOCAL_IMAGE" ]; then
          IMAGE_ID=$(echo "$LOAD_OUTPUT" | sed -n 's/^Loaded image ID: //p' | head -1)
          if [ -z "$IMAGE_ID" ]; then
            echo "Could not determine loaded image from docker load output" >&2
            exit 1
          fi
          LOCAL_IMAGE="$IMAGE_ID"
        fi

        failures=0
        primary_ref=""

        push_image() {
          local ref="$1"
          local prefix="$2"

          docker tag "$LOCAL_IMAGE" "$ref"
          if docker push "$ref"; then
            echo "${prefix}-pushed=true" >> "$GITHUB_OUTPUT"
            echo "${prefix}-image-ref=${ref}" >> "$GITHUB_OUTPUT"
            [ -z "$primary_ref" ] && primary_ref="$ref"
          else
            echo "${prefix}-pushed=false" >> "$GITHUB_OUTPUT"
            failures=$((failures + 1))
          fi
        }

        if [ "${{ steps.registries.outputs.ghcr }}" = "true" ]; then
          push_image "${{ steps.registries.outputs.ghcr-ref }}" ghcr
        fi

        if [ "${{ steps.registries.outputs.dockerhub }}" = "true" ]; then
          push_image "${{ steps.registries.outputs.dockerhub-ref }}" dockerhub
        fi

        if [ "$failures" -gt 0 ]; then
          echo "One or more configured registries failed" >&2
          exit 1
        fi

        echo "image-ref=${primary_ref}" >> "$GITHUB_OUTPUT"
