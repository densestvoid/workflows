name: 'Build Go'
description: 'Build one Go binary and upload as artifact (cached internally)'
inputs:
  working-directory:
    description: 'Go module root'
    required: false
    default: '.'
  content-key:
    description: 'Cache key prefix from detect-changes'
    required: true
  main-package:
    description: 'Package path to build (e.g. ./cmd/server)'
    required: true
  artifact-name:
    description: 'Artifact name (default: basename of main-package)'
    required: false
    default: ''
outputs:
  artifact-name:
    description: 'Uploaded artifact name'
    value: ${{ steps.meta.outputs.artifact-name }}
runs:
  using: 'composite'
  steps:
    - name: Resolve inputs
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        MAIN_PACKAGE="${{ inputs.main-package }}"
        ARTIFACT_NAME="${{ inputs.artifact-name }}"
        if [ -z "$ARTIFACT_NAME" ]; then
          ARTIFACT_NAME=$(basename "$MAIN_PACKAGE")
        fi
        echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
        echo "main-package=${MAIN_PACKAGE}" >> "$GITHUB_OUTPUT"

    - name: Checkout Go sources
      uses: actions/checkout@v4
      with:
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          go.mod
          go.sum
          **/*.go

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.working-directory == '.' && 'go.mod' || format('{0}/go.mod', inputs.working-directory) }}
        cache-dependency-path: ${{ inputs.working-directory == '.' && 'go.sum' || format('{0}/go.sum', inputs.working-directory) }}

    - name: Restore binary cache
      uses: actions/cache@v4
      id: binary-cache
      with:
        path: ${{ runner.temp }}/build-go-${{ steps.meta.outputs.artifact-name }}
        key: build-go-${{ inputs.content-key }}-${{ steps.meta.outputs.main-package }}-${{ runner.os }}
        restore-keys: |
          build-go-${{ inputs.content-key }}-

    - name: Build binary
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARTIFACT_NAME: ${{ steps.meta.outputs.artifact-name }}
        MAIN_PACKAGE: ${{ steps.meta.outputs.main-package }}
        BINARY_PATH: ${{ runner.temp }}/build-go-${{ steps.meta.outputs.artifact-name }}
      run: |
        set -euo pipefail
        mkdir -p bin

        if [ ! -f "$BINARY_PATH" ]; then
          CGO_ENABLED=0 GOOS=linux go build -o "$BINARY_PATH" "$MAIN_PACKAGE"
        fi

        cp "$BINARY_PATH" "bin/${ARTIFACT_NAME}"

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.meta.outputs.artifact-name }}
        path: ${{ inputs.working-directory == '.' && format('bin/{0}', steps.meta.outputs.artifact-name) || format('{0}/bin/{1}', inputs.working-directory, steps.meta.outputs.artifact-name) }}
        if-no-files-found: error
