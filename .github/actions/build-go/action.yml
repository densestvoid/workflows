name: 'Build Go'
description: 'Build one Go binary and upload as artifact (cached internally)'
inputs:
  main-package:
    description: 'Package path to build (e.g. ./cmd/server)'
    required: true
  artifact-name:
    description: 'Artifact name and binary filename at repo root (default: basename of main-package)'
    required: false
    default: ''
  goos:
    description: 'GOOS for go build'
    required: false
    default: 'linux'
  goarch:
    description: 'GOARCH for go build'
    required: false
    default: 'amd64'
outputs:
  artifact-name:
    description: 'Artifact name for downstream download'
    value: ${{ env.ARTIFACT_NAME }}
runs:
  using: 'composite'
  steps:
    - name: Checkout Go sources
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Resolve artifact name
      shell: bash
      run: |
        set -euo pipefail
        ARTIFACT_NAME='${{ inputs.artifact-name }}'
        ARTIFACT_NAME="${ARTIFACT_NAME:-$(basename '${{ inputs.main-package }}')}"
        echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

    - name: Compute cache key
      id: cache-key
      shell: bash
      run: |
        set -euo pipefail
        list_template='{{if not .Standard}}{{range .GoFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}{{range .EmbedFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}{{range .CgoFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}{{range .CFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}{{end}}'
        cache_key=$(
          {
            for module_file in go.mod go.sum; do
              [ -f "$module_file" ] && printf '%s\n' "$module_file"
            done
            go list -deps -f "$list_template" '${{ inputs.main-package }}'
          } | sort -u | tar -c --files-from - | sha256sum | cut -d' ' -f1
        )
        echo "cache_key=${cache_key}" >> "$GITHUB_OUTPUT"

    - name: Restore binary cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ env.ARTIFACT_NAME }}
        key: build-go-${{ steps.cache-key.outputs.cache_key }}-${{ inputs.goos }}-${{ inputs.goarch }}

    - name: Build binary
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: CGO_ENABLED=0 GOOS=${{ inputs.goos }} GOARCH=${{ inputs.goarch }} go build -o "${{ env.ARTIFACT_NAME }}" '${{ inputs.main-package }}'

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.ARTIFACT_NAME }}
        if-no-files-found: error
