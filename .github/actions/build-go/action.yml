name: 'Build Go'
description: 'Build one Go binary and upload as artifact (cached internally)'
inputs:
  working-directory:
    description: 'Go module root'
    required: false
    default: '.'
  content-key:
    description: 'Cache key prefix from detect-changes'
    required: true
  main-package:
    description: 'Package path to build (e.g. ./cmd/server)'
    required: true
  artifact-name:
    description: 'Output path and artifact name (e.g. budget, bin/server). Default: basename of main-package'
    required: false
    default: ''
outputs:
  artifact-name:
    description: 'Artifact name for downstream download (slashes replaced with dashes)'
    value: ${{ steps.meta.outputs.artifact-name }}
  artifact-path:
    description: 'Output path of the binary within the artifact'
    value: ${{ steps.meta.outputs.artifact-path }}
runs:
  using: 'composite'
  steps:
    - name: Resolve inputs
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        MAIN_PACKAGE="${{ inputs.main-package }}"
        ARTIFACT_PATH="${{ inputs.artifact-name }}"
        if [ -z "$ARTIFACT_PATH" ]; then
          ARTIFACT_PATH=$(basename "$MAIN_PACKAGE")
        fi
        UPLOAD_NAME=$(printf '%s' "$ARTIFACT_PATH" | tr '/' '-')
        echo "artifact-path=${ARTIFACT_PATH}" >> "$GITHUB_OUTPUT"
        echo "artifact-name=${UPLOAD_NAME}" >> "$GITHUB_OUTPUT"
        echo "main-package=${MAIN_PACKAGE}" >> "$GITHUB_OUTPUT"

    - name: Checkout Go sources
      uses: actions/checkout@v4
      with:
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          go.mod
          go.sum
          **/*.go

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.working-directory == '.' && 'go.mod' || format('{0}/go.mod', inputs.working-directory) }}
        cache-dependency-path: ${{ inputs.working-directory == '.' && 'go.sum' || format('{0}/go.sum', inputs.working-directory) }}

    - name: Restore binary cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/build-go-${{ steps.meta.outputs.artifact-name }}
        key: build-go-${{ inputs.content-key }}-${{ steps.meta.outputs.main-package }}-${{ steps.meta.outputs.artifact-path }}-${{ runner.os }}
        restore-keys: |
          build-go-${{ inputs.content-key }}-

    - name: Build binary
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARTIFACT_PATH: ${{ steps.meta.outputs.artifact-path }}
        MAIN_PACKAGE: ${{ steps.meta.outputs.main-package }}
        CACHE_BINARY: ${{ runner.temp }}/build-go-${{ steps.meta.outputs.artifact-name }}
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$ARTIFACT_PATH")"

        if [ ! -f "$CACHE_BINARY" ]; then
          CGO_ENABLED=0 GOOS=linux go build -o "$CACHE_BINARY" "$MAIN_PACKAGE"
        fi

        cp "$CACHE_BINARY" "$ARTIFACT_PATH"

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.meta.outputs.artifact-name }}
        path: ${{ inputs.working-directory == '.' && steps.meta.outputs.artifact-path || format('{0}/{1}', inputs.working-directory, steps.meta.outputs.artifact-path) }}
        if-no-files-found: error
