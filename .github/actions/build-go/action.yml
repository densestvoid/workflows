name: 'Build Go'
description: 'Build one Go binary and upload as artifact (cached internally)'
inputs:
  working-directory:
    description: 'Go module root'
    required: false
    default: '.'
  main-package:
    description: 'Package path to build (e.g. ./cmd/server)'
    required: true
  artifact-name:
    description: 'Artifact name and binary filename at repo root (default: basename of main-package)'
    required: false
    default: ''
outputs:
  artifact-name:
    description: 'Artifact name for downstream download'
    value: ${{ steps.meta.outputs.artifact-name }}
runs:
  using: 'composite'
  steps:
    - name: Resolve inputs
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        MAIN_PACKAGE="${{ inputs.main-package }}"
        ARTIFACT_NAME="${{ inputs.artifact-name }}"
        if [ -z "$ARTIFACT_NAME" ]; then
          ARTIFACT_NAME=$(basename "$MAIN_PACKAGE")
        fi
        echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
        echo "main-package=${MAIN_PACKAGE}" >> "$GITHUB_OUTPUT"

    - name: Checkout Go sources
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.working-directory == '.' && 'go.mod' || format('{0}/go.mod', inputs.working-directory) }}
        cache-dependency-path: ${{ inputs.working-directory == '.' && 'go.sum' || format('{0}/go.sum', inputs.working-directory) }}

    - name: Compute cache key
      id: cache-key
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        MAIN_PACKAGE="${{ steps.meta.outputs.main-package }}"
        HASH_INPUT=$(mktemp)
        trap 'rm -f "$HASH_INPUT"' EXIT
        : > "$HASH_INPUT"

        for module_file in go.mod go.sum; do
          if [ -f "$module_file" ]; then
            printf '%s\0' "$module_file" >> "$HASH_INPUT"
            cat "$module_file" >> "$HASH_INPUT"
          fi
        done

        while IFS= read -r file; do
          [ -z "$file" ] && continue
          [ -f "$file" ] || continue
          printf '%s\0' "$file" >> "$HASH_INPUT"
          cat "$file" >> "$HASH_INPUT"
        done < <(
          go list -deps -f '{{if not .Standard}}{{range .GoFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}{{range .EmbedFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}{{range .CgoFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}{{range .CFiles}}{{$.Dir}}/{{.}}{{"\n"}}{{end}}{{end}}' "$MAIN_PACKAGE" | sort -u
        )

        HASH=$(sha256sum "$HASH_INPUT" | awk '{print substr($1,1,16)}')
        echo "key=${HASH}" >> "$GITHUB_OUTPUT"

    - name: Restore binary cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/build-go-${{ steps.meta.outputs.artifact-name }}
        key: build-go-${{ steps.cache-key.outputs.key }}-${{ steps.meta.outputs.main-package }}-${{ steps.meta.outputs.artifact-name }}-${{ runner.os }}
        restore-keys: |
          build-go-${{ steps.cache-key.outputs.key }}-

    - name: Build binary
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ARTIFACT_NAME: ${{ steps.meta.outputs.artifact-name }}
        MAIN_PACKAGE: ${{ steps.meta.outputs.main-package }}
        CACHE_BINARY: ${{ runner.temp }}/build-go-${{ steps.meta.outputs.artifact-name }}
      run: |
        set -euo pipefail

        if [ ! -f "$CACHE_BINARY" ]; then
          CGO_ENABLED=0 GOOS=linux go build -o "$CACHE_BINARY" "$MAIN_PACKAGE"
        fi

        cp "$CACHE_BINARY" "${GITHUB_WORKSPACE}/${ARTIFACT_NAME}"

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.meta.outputs.artifact-name }}
        path: ${{ steps.meta.outputs.artifact-name }}
        if-no-files-found: error
