name: 'Build Go'
description: 'Build one Go binary and upload as artifact (cached internally)'
inputs:
  working-directory:
    description: 'Go module root'
    required: false
    default: '.'
  main-package:
    description: 'Package path to build (e.g. ./cmd/server)'
    required: true
  artifact-name:
    description: 'Artifact name and binary filename at repo root (default: basename of main-package)'
    required: false
    default: ''
outputs:
  artifact-name:
    description: 'Artifact name for downstream download'
    value: ${{ env.ARTIFACT_NAME }}
runs:
  using: 'composite'
  steps:
    - name: Checkout Go sources
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.working-directory == '.' && 'go.mod' || format('{0}/go.mod', inputs.working-directory) }}
        cache-dependency-path: ${{ inputs.working-directory == '.' && 'go.sum' || format('{0}/go.sum', inputs.working-directory) }}

    - name: Resolve artifact name
      shell: bash
      run: |
        set -euo pipefail
        ARTIFACT_NAME='${{ inputs.artifact-name }}'
        ARTIFACT_NAME="${ARTIFACT_NAME:-$(basename '${{ inputs.main-package }}')}"
        echo "ARTIFACT_NAME=${ARTIFACT_NAME}" >> "$GITHUB_ENV"

    - name: Compute cache key
      id: cache-key
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        cache_key=$(
          for file in $(
            go list -deps -json '${{ inputs.main-package }}' | jq -r '
              select(.Standard != true) | .Dir as $d |
              ((.GoFiles // []) + (.EmbedFiles // []) + (.CgoFiles // []) + (.CFiles // [])[])[] |
              "\($d)/\(.)"
            ' | sort -u
          ); do
            cat "$file"
          done | sha256sum | awk '{print $1}'
        )
        echo "cache_key=${cache_key}" >> "$GITHUB_OUTPUT"

    - name: Restore binary cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/build-go-${{ env.ARTIFACT_NAME }}
        key: build-go-${{ steps.cache-key.outputs.cache_key }}

    - name: Build binary
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: CGO_ENABLED=0 GOOS=linux go build -o "${{ runner.temp }}/build-go-${{ env.ARTIFACT_NAME }}" '${{ inputs.main-package }}'

    - name: Copy binary to workspace
      shell: bash
      run: cp "${{ runner.temp }}/build-go-${{ env.ARTIFACT_NAME }}" "${{ GITHUB_WORKSPACE }}/${{ env.ARTIFACT_NAME }}"

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.ARTIFACT_NAME }}
        if-no-files-found: error
