# Repo-specific composable CI for densestvoid/workflows — actionlint when workflow or action files change.
# Called from ci.yml via $/.github/workflows/ci-checks.yml. No gate job; caller job ci is the merge check.

name: CI Checks

on:
  workflow_call:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/actionlint
