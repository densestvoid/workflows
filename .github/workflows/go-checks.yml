# Reusable Go Checks workflow
# Parallel Go quality checks: vet, staticcheck, golangci-lint, govulncheck, gosec

name: Go Checks

on:
  workflow_call:
    inputs:
      go-version:
        description: 'Explicit Go version (overrides go-version-file when set)'
        required: false
        type: string
        default: ''
      go-version-file:
        description: 'Path to go.mod etc. (default: {working-directory}/go.mod)'
        required: false
        type: string
        default: ''
      working-directory:
        description: 'Working directory for the Go project'
        required: false
        type: string
        default: '.'
    secrets:
      github-token:
        description: 'GitHub token for accessing private repositories'
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go (explicit version)
        if: ${{ inputs.go-version != '' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true
          cache-dependency-path: >-
            ${{ inputs.working-directory == '.' && 'go.sum'
              || format('{0}/go.sum', inputs.working-directory) }}

      - name: Setup Go (from version file)
        if: ${{ inputs.go-version == '' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: >-
            ${{ inputs.go-version-file != '' && inputs.go-version-file
              || (inputs.working-directory == '.' && 'go.mod'
                || format('{0}/go.mod', inputs.working-directory)) }}
          cache-dependency-path: >-
            ${{ inputs.working-directory == '.' && 'go.sum'
              || format('{0}/go.sum', inputs.working-directory) }}

      - name: Vet
        run: go vet ./...
        working-directory: ${{ inputs.working-directory }}

  Static-Analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go (explicit version)
        if: ${{ inputs.go-version != '' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true
          cache-dependency-path: >-
            ${{ inputs.working-directory == '.' && 'go.sum'
              || format('{0}/go.sum', inputs.working-directory) }}

      - name: Setup Go (from version file)
        if: ${{ inputs.go-version == '' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: >-
            ${{ inputs.go-version-file != '' && inputs.go-version-file
              || (inputs.working-directory == '.' && 'go.mod'
                || format('{0}/go.mod', inputs.working-directory)) }}
          cache-dependency-path: >-
            ${{ inputs.working-directory == '.' && 'go.sum'
              || format('{0}/go.sum', inputs.working-directory) }}

      - name: Install staticcheck
        uses: densestvoid/workflows/.github/actions/install-go-tool@main
        with:
          tool-package: honnef.co/go/tools/cmd/staticcheck

      - name: Static analysis
        run: staticcheck ./...
        working-directory: ${{ inputs.working-directory }}

  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go (explicit version)
        if: ${{ inputs.go-version != '' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true
          cache-dependency-path: >-
            ${{ inputs.working-directory == '.' && 'go.sum'
              || format('{0}/go.sum', inputs.working-directory) }}

      - name: Setup Go (from version file)
        if: ${{ inputs.go-version == '' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: >-
            ${{ inputs.go-version-file != '' && inputs.go-version-file
              || (inputs.working-directory == '.' && 'go.mod'
                || format('{0}/go.mod', inputs.working-directory)) }}
          cache-dependency-path: >-
            ${{ inputs.working-directory == '.' && 'go.sum'
              || format('{0}/go.sum', inputs.working-directory) }}

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ inputs.working-directory }}

  Vulnerability-Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go (explicit version)
        if: ${{ inputs.go-version != '' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true
          cache-dependency-path: >-
            ${{ inputs.working-directory == '.' && 'go.sum'
              || format('{0}/go.sum', inputs.working-directory) }}

      - name: Setup Go (from version file)
        if: ${{ inputs.go-version == '' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: >-
            ${{ inputs.go-version-file != '' && inputs.go-version-file
              || (inputs.working-directory == '.' && 'go.mod'
                || format('{0}/go.mod', inputs.working-directory)) }}
          cache-dependency-path: >-
            ${{ inputs.working-directory == '.' && 'go.sum'
              || format('{0}/go.sum', inputs.working-directory) }}

      - name: Vulnerability check
        uses: golangci/govulncheck-action@v1
        with:
          work-dir: ${{ inputs.working-directory }}

  Security-Check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Go (explicit version)
        if: ${{ inputs.go-version != '' }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          check-latest: true
          cache-dependency-path: >-
            ${{ inputs.working-directory == '.' && 'go.sum'
              || format('{0}/go.sum', inputs.working-directory) }}

      - name: Setup Go (from version file)
        if: ${{ inputs.go-version == '' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: >-
            ${{ inputs.go-version-file != '' && inputs.go-version-file
              || (inputs.working-directory == '.' && 'go.mod'
                || format('{0}/go.mod', inputs.working-directory)) }}
          cache-dependency-path: >-
            ${{ inputs.working-directory == '.' && 'go.sum'
              || format('{0}/go.sum', inputs.working-directory) }}

      - name: Security check
        uses: securego/gosec@v2
        with:
          args: >-
            ${{ inputs.working-directory == '.' && './...'
              || format('./{0}/...', inputs.working-directory) }}
