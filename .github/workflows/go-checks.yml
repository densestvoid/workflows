# Reusable Go Checks workflow — vet, staticcheck, golangci-lint, govulncheck, gosec (parallel jobs).
#
# Consumer repos must declare these tools in a go.mod tool block. install-go-tool
# runs bare `go install <pkg>` (no @version) so module-selected versions apply.

# Module paths (workflow env):
#   GO_VERSION_FILE — go-version-file input when set; else go.mod under working-directory.
#   GO_CACHE_DEPENDENCY_PATH — matching go.sum path.
#
# Expression syntax (GitHub Actions):
#   ${{ A && B || C }}              if A then B else C
#   ${{ format('{0}/go.mod', dir) }}  interpolate dir into a path string

name: Go Checks

on:
  workflow_call:
    inputs:
      go-version-file:
        description: 'Path to go.mod (default: {working-directory}/go.mod)'
        required: false
        type: string
        default: ''
      working-directory:
        description: 'Working directory for the Go project'
        required: false
        type: string
        default: '.'

env:
  GO_VERSION_FILE: >-
    ${{ inputs.go-version-file != '' && inputs.go-version-file
      || (inputs.working-directory == '.' && 'go.mod'
        || format('{0}/go.mod', inputs.working-directory)) }}
  GO_CACHE_DEPENDENCY_PATH: >-
    ${{ inputs.working-directory == '.' && 'go.sum'
      || format('{0}/go.sum', inputs.working-directory) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Vet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Vet
        run: go vet ./...

  Static-Analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Install staticcheck
        uses: $/.github/actions/install-go-tool
        with:
          tool-package: honnef.co/go/tools/cmd/staticcheck
          working-directory: ${{ inputs.working-directory }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Static analysis
        run: staticcheck ./...

  Lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Install golangci-lint
        uses: $/.github/actions/install-go-tool
        with:
          tool-package: github.com/golangci/golangci-lint/cmd/golangci-lint
          working-directory: ${{ inputs.working-directory }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Lint
        run: golangci-lint run ./...

  Vulnerability-Check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Install govulncheck
        uses: $/.github/actions/install-go-tool
        with:
          tool-package: golang.org/x/vuln/cmd/govulncheck
          working-directory: ${{ inputs.working-directory }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Vulnerability check
        run: govulncheck ./...

  Security-Check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Install gosec
        uses: $/.github/actions/install-go-tool
        with:
          tool-package: github.com/securego/gosec/v2/cmd/gosec
          working-directory: ${{ inputs.working-directory }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Security check
        run: gosec ./...
