# Reusable Go Checks workflow
# Parallel Go quality checks: vet, staticcheck, golangci-lint, govulncheck, gosec
#
# Resolved paths (see workflow env):
#   GO_VERSION_FILE — go-version-file input when set; else go.mod at working-directory
#   GO_CACHE_DEPENDENCY_PATH — go.sum alongside that module

name: Go Checks

on:
  workflow_call:
    inputs:
      go-version-file:
        description: 'Path to go.mod etc. (default: {working-directory}/go.mod)'
        required: false
        type: string
        default: ''
      working-directory:
        description: 'Working directory for the Go project'
        required: false
        type: string
        default: '.'

env:
  GO_VERSION_FILE: >-
    ${{ inputs.go-version-file != '' && inputs.go-version-file
      || (inputs.working-directory == '.' && 'go.mod'
        || format('{0}/go.mod', inputs.working-directory)) }}
  GO_CACHE_DEPENDENCY_PATH: >-
    ${{ inputs.working-directory == '.' && 'go.sum'
      || format('{0}/go.sum', inputs.working-directory) }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Vet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Vet
        run: go vet ./...

  Static-Analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Install staticcheck
        uses: ./.github/actions/install-go-tool
        with:
          tool-package: honnef.co/go/tools/cmd/staticcheck

      - name: Static analysis
        run: staticcheck ./...

  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: ${{ inputs.working-directory }}

  Vulnerability-Check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      - name: Vulnerability check
        uses: golangci/govulncheck-action@v1
        with:
          work-dir: ${{ inputs.working-directory }}

  Security-Check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache-dependency-path: ${{ env.GO_CACHE_DEPENDENCY_PATH }}

      # securego/gosec is a Docker action with args only — no working-directory input
      # and step working-directory does not apply to Docker actions. Package paths
      # must be repo-root-relative (./... or ./{working-directory}/...), not ./...
      # with a step working-directory like vet/staticcheck use.
      - name: Security check
        uses: securego/gosec@v2
        with:
          args: >-
            ${{ inputs.working-directory == '.' && './...'
              || format('./{0}/...', inputs.working-directory) }}
